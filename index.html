<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 7 Lab Manual - Simulators & Animations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #1a365d;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #4a5568;
            margin-bottom: 30px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card a {
            text-decoration: none;
            color: #2b6cb0;
            font-weight: bold;
            font-size: 18px;
        }
        .card a:hover {
            color: #1a365d;
        }
        footer {
            margin-top: 40px;
            color: #718096;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Class 7 Lab Manual</h1>
    <p class="subtitle">Select any simulator or animation below</p>

    <div class="container">
        <!-- Change the names and links according to your files -->
        <div class="card">
            <a href="simulations/sim1.html">1. Plant Respiration</a>
        </div>
        <div class="card">
            <a href="simulations/sim2.html">2. Photosynthesis Animation</a>
        </div>
        <div class="card">
            <a href="simulations/animation3.html">3. Human Digestive System</a>
        </div>
        <div class="card">
            <a href="simulations/sim4.html">4. Electric Circuit Simulator</a>
        </div>
        <!-- Add more cards like this for all 16 files -->
        <!-- Example:
        <div class="card">
            <a href="simulations/your-filename.html">5. Your Experiment Name</a>
        </div>
        -->
    </div>

    <footer>
        Made for Class 7 Students | Lab Manual Simulators
    </footer>
</body>
</html>
